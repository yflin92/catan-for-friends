# Local validation: blackbox-exporter probes the server's /healthz like the Synthetic Monitoring check does
# (job catan-healthz, instance = the probed URL, every 120 s).
global:
  evaluation_interval: 60s
scrape_configs:
  - job_name: catan-healthz
    scrape_interval: 120s
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ['http://catan-server:8080/healthz']
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
