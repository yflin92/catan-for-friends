# Nightly run of the full unit and property suite on main. Longer suites (property runs at higher counts, load and
# fault-injection) are added here by the Verify tasks on the V43 cadence.
name: nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - run: pnpm test

  # E-INT property walker at nightly scale (V43): 100,000 playouts over the 4 shard files.
  walker:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:walker
        env:
          HEXLANDS_WALK_RUNS: '100000'

  # AC31 (C-9) in Chromium, Firefox and WebKit: the full-game runs through the UI on all three engines; the X-mobile
  # phone smoke (390×844) on Chromium and WebKit; the C-A11Y axe pass and keyboard-only turn on all three engines.
  e2e-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Browser downloads: each attempt has its own timeout, with bounded retries (.github/scripts/retry.sh).
      - name: Install browsers
        timeout-minutes: 12
        run: bash .github/scripts/retry.sh 3 200 -- pnpm --filter @hexlands/web exec playwright install chromium firefox webkit
      # apt packages for the browsers via .github/scripts/install-browser-deps.sh (run as root): 2 attempts of 540 s, each
      # killed with its whole process group on timeout, and the apt/dpkg locks waited for (300 s) before every attempt.
      - name: Install browser system dependencies
        timeout-minutes: 30
        run: sudo -E env "PATH=$PATH" bash .github/scripts/install-browser-deps.sh 2 540 300 -- pnpm --filter @hexlands/web exec playwright install-deps chromium firefox webkit
      - run: pnpm --filter @hexlands/web run build
      - run: pnpm --filter @hexlands/web exec playwright test e2e/full-game.spec.ts e2e/mobile.spec.ts e2e/a11y.spec.ts e2e/keyboard.spec.ts
        env:
          HEXLANDS_E2E_BROWSERS: all

  # V39 (V43 nightly cadence): regenerate the TLC CatanTrade cover traces and replay them through the engine.
  tla-traces:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TLC traces
        working-directory: docs/tla
        run: |
          curl -sSfL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "7beec0f04818732a62fa193731711a99aa4f11279499b2360a7d156c519ea78d  tla2tools.jar" | sha256sum -c -
          sh dump-traces.sh "$RUNNER_TEMP/tla-traces"
      - run: pnpm vitest run tooling/tla-traces.test.ts
        env:
          HEXLANDS_TLA_TRACES_DIR: ${{ runner.temp }}/tla-traces

  # S-HARD (e), V23/V24 at nightly scale: 100 SIGTERM + 100 SIGKILL kills of a real child server at a random point
  # mid-game, each checked by the crash oracle (no lost acked action, no double apply, restart hash = independent
  # replay; SIGTERM also checks the drain). The base seed comes from the run number, so every night covers new kill
  # points and any failure is reproducible from the logged seed.
  crash-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Crash sweep
        env:
          HEXLANDS_CRASH_RUNS: '100'
          HEXLANDS_CRASH_ARTIFACTS_DIR: ${{ runner.temp }}/crash-artifacts
        run: |
          export HEXLANDS_CRASH_SEED=$(( ${{ github.run_number }} * 1000 ))
          echo "crash sweep: runs=$HEXLANDS_CRASH_RUNS per signal, base seed=$HEXLANDS_CRASH_SEED (rerun locally with the same values)"
          pnpm vitest run apps/server/src/crash-oracle.test.ts
      - name: Upload failing seeds and databases
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: crash-sweep-${{ github.run_number }}
          path: ${{ runner.temp }}/crash-artifacts
          if-no-files-found: ignore
          retention-days: 14
