# Nightly run of the full unit and property suite on main. Longer suites (property runs at higher counts, load and
# fault-injection) are added here by the Verify tasks on the V43 cadence.
name: nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - run: pnpm test

  # E-INT property walker at nightly scale (V43): 100,000 playouts over the 4 shard files.
  walker:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:walker
        env:
          HEXLANDS_WALK_RUNS: '100000'

  # AC31 (C-9) in Chromium, Firefox and WebKit: the full-game runs through the UI on all three engines.
  e2e-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each install attempt has its own timeout, with bounded retries (.github/scripts/retry.sh).
      - name: Install browsers
        timeout-minutes: 12
        run: bash .github/scripts/retry.sh 3 200 -- pnpm --filter @hexlands/web exec playwright install chromium firefox webkit
      - name: Install browser system dependencies
        timeout-minutes: 12
        run: bash .github/scripts/retry.sh 3 200 -- pnpm --filter @hexlands/web exec playwright install-deps chromium firefox webkit
      - run: pnpm --filter @hexlands/web run build
      - run: pnpm --filter @hexlands/web exec playwright test e2e/full-game.spec.ts
        env:
          HEXLANDS_E2E_BROWSERS: all

  # V39 (V43 nightly cadence): regenerate the TLC CatanTrade cover traces and replay them through the engine.
  tla-traces:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: TLC traces
        working-directory: docs/tla
        run: |
          curl -sSfL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.8.0/tla2tools.jar
          echo "7beec0f04818732a62fa193731711a99aa4f11279499b2360a7d156c519ea78d  tla2tools.jar" | sha256sum -c -
          sh dump-traces.sh "$RUNNER_TEMP/tla-traces"
      - run: pnpm vitest run tooling/tla-traces.test.ts
        env:
          HEXLANDS_TLA_TRACES_DIR: ${{ runner.temp }}/tla-traces
