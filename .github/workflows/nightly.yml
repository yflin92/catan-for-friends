# Nightly run of the full unit and property suite on main. Longer suites (property runs at higher counts, load and
# fault-injection) are added here by the Verify tasks on the V43 cadence.
name: nightly

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm depcruise
      - run: pnpm test

  # E-INT property walker at nightly scale (V43): 100,000 playouts over the 4 shard files.
  walker:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:walker
        env:
          HEXLANDS_WALK_RUNS: '100000'

  # AC31 (C-9) in Chromium, Firefox and WebKit: the full-game runs through the UI on all three engines.
  e2e-browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @hexlands/web exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @hexlands/web run build
      - run: pnpm --filter @hexlands/web exec playwright test e2e/full-game.spec.ts
        env:
          HEXLANDS_E2E_BROWSERS: all
