# AC23 (C-8) reload timing at full scale: 5 sub-states × 20 reloads in Chromium and in WebKit, each with the p95 < 5 s
# and max < 10 s gates; the timing table (p50/p95/max per browser and sub-state) is in the job log. Runs nightly on main,
# and on demand against any ref (a branch, tag or commit SHA, e.g. a PR head) without the rest of the nightly suite.
name: reload-timing

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA to test
        required: false
        default: main

permissions:
  contents: read

jobs:
  reload-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each install attempt has its own timeout, with bounded retries (.github/scripts/retry.sh).
      - name: Install browsers
        timeout-minutes: 12
        run: bash .github/scripts/retry.sh 3 200 -- pnpm --filter @hexlands/web exec playwright install chromium webkit
      # WebKit's apt dependencies (~180 packages, ~115 MB) can take several minutes; an attempt cut off mid-install
      # leaves apt holding the dpkg lock for the next one, so each attempt gets the time a full install needs.
      - name: Install browser system dependencies
        timeout-minutes: 20
        run: bash .github/scripts/retry.sh 2 540 -- pnpm --filter @hexlands/web exec playwright install-deps chromium webkit
      - run: pnpm --filter @hexlands/web run build
      - name: AC23 reload timing (5 × 20, Chromium and WebKit)
        run: pnpm --filter @hexlands/web exec playwright test e2e/reload.spec.ts --project=chromium --project=webkit --reporter=list
        env:
          HEXLANDS_RELOADS: '20'
          HEXLANDS_E2E_BROWSERS: all
