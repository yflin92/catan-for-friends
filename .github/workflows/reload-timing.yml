# AC23 (C-8) reload timing at full scale: 5 sub-states × 20 reloads; the timing table is in the job log. Runs nightly
# on main, and on demand against any ref (a branch, tag or commit SHA, e.g. a PR head) without the rest of the nightly
# suite.
name: reload-timing

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit SHA to test
        required: false
        default: main

permissions:
  contents: read

jobs:
  reload-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Each install attempt has its own timeout, with bounded retries (.github/scripts/retry.sh).
      - name: Install Chromium
        timeout-minutes: 12
        run: bash .github/scripts/retry.sh 3 200 -- pnpm --filter @hexlands/web exec playwright install chromium
      - name: Install Chromium system dependencies
        timeout-minutes: 12
        run: bash .github/scripts/retry.sh 3 200 -- pnpm --filter @hexlands/web exec playwright install-deps chromium
      - run: pnpm --filter @hexlands/web run build
      - name: AC23 reload timing (5 × 20)
        run: pnpm --filter @hexlands/web exec playwright test e2e/reload.spec.ts --reporter=list
        env:
          HEXLANDS_RELOADS: '20'
