# PR gate. Job names (lint, typecheck, depcruise, test, walker, e2e) are the required status checks listed in docs/README.md;
# keep them stable.
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - name: No tracked env files (only *.env.example)
        run: bash tooling/check-tracked-env.sh

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  depcruise:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm depcruise

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The E-INT property walker (1,000 playouts over 4 shard files), kept out of `test` so it never starves that suite.
  walker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:walker

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(pnpm --filter @hexlands/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}-chromium
      - name: Install Chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @hexlands/web exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @hexlands/web exec playwright install-deps chromium
      - name: Build web app
        run: pnpm --filter @hexlands/web run build
      - name: Bundle budget (NFR14, < 300 KB gz JS)
        run: pnpm --filter @hexlands/web run budget
      - run: pnpm e2e

  # The deploy image (deploy/Dockerfile): one build version for bundle, version.txt and server (D12), and the build
  # refuses any test code in the shipped artefacts (O2-3b). Not a required check (docs/README.md).
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the deploy image
        run: docker build -f deploy/Dockerfile --build-arg HEXLANDS_BUILD_VERSION="${GITHUB_SHA::12}" -t catan-server:ci .
      - name: Image runs and reports its version
        run: |
          docker run -d --name ci-server -e HEXLANDS_TELEMETRY=off catan-server:ci
          for _ in $(seq 1 30); do
            v="$(docker exec ci-server node -e "fetch('http://127.0.0.1:8080/healthz').then(r=>r.json()).then(h=>console.log(h.version)).catch(()=>{})" || true)"
            [ "$v" = "${GITHUB_SHA::12}" ] && break
            sleep 1
          done
          docker logs ci-server
          [ "$v" = "${GITHUB_SHA::12}" ]
          [ "$(docker exec ci-server cat /app/web/version.txt)" = "${GITHUB_SHA::12}" ]
